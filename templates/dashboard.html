<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>CIC-IDS Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root{--pri:#2563eb;--sec:#0ea5e9;}
    body{padding-top:62px;background:#f1f5f9;font-family:'Segoe UI',sans-serif;}
    .navbar{background:linear-gradient(135deg,var(--pri),var(--sec));}
    .card{border:none;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.08);margin-bottom:1.2rem;}
    .stat-val{font-size:2.4rem;font-weight:700;line-height:1.1;}
    .risk-High{color:#dc2626;} .risk-Medium{color:#d97706;} .risk-Low{color:#16a34a;}
    #trafficChart{height:240px!important;}
    .badge-High{background:#fee2e2;color:#991b1b;}
    .badge-Medium{background:#fef3c7;color:#92400e;}
    .badge-Low{background:#d1fae5;color:#065f46;}
    .alert-row:hover{background:#f8fafc;cursor:pointer;}
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark fixed-top">
  <div class="container-fluid px-4">
    <a class="navbar-brand fw-bold" href="/"><i class="fas fa-shield-halved me-2"></i>CIC-IDS Monitor</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link active" href="/"><i class="fas fa-gauge me-1"></i>Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="/alerts"><i class="fas fa-triangle-exclamation me-1"></i>Alerts</a></li>
        <li class="nav-item"><a class="nav-link" href="/settings"><i class="fas fa-gear me-1"></i>Settings</a></li>
      </ul>
      <span class="navbar-text small">
        <span id="sys-dot" class="me-1">⚪</span><span id="sys-status">Connecting…</span>
      </span>
    </div>
  </div>
</nav>

<div class="container-fluid px-4">

  <!-- Stat cards -->
  <div class="row g-3 mb-2">
    <div class="col-6 col-md-3">
      <div class="card bg-primary text-white p-3 text-center">
        <div class="small opacity-75"><i class="fas fa-bolt me-1"></i>Packets / sec</div>
        <div class="stat-val" id="pps">—</div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="card bg-success text-white p-3 text-center">
        <div class="small opacity-75"><i class="fas fa-layer-group me-1"></i>Total Packets</div>
        <div class="stat-val" id="total-pkts">—</div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="card bg-danger text-white p-3 text-center">
        <div class="small opacity-75"><i class="fas fa-circle-exclamation me-1"></i>Active Alerts</div>
        <div class="stat-val" id="active-alerts">—</div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="card bg-info text-white p-3 text-center">
        <div class="small opacity-75"><i class="fas fa-network-wired me-1"></i>Total Alerts</div>
        <div class="stat-val" id="total-alerts">—</div>
      </div>
    </div>
  </div>

  <!-- Charts row -->
  <div class="row g-3 mb-2">
    <div class="col-md-8">
      <div class="card p-3">
        <div class="fw-semibold mb-2"><i class="fas fa-chart-area me-1 text-primary"></i>Live Traffic (packets/sec)</div>
        <canvas id="trafficChart"></canvas>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card p-3 h-100">
        <div class="fw-semibold mb-2"><i class="fas fa-chart-pie me-1 text-primary"></i>Protocol Mix</div>
        <canvas id="protoChart" style="max-height:200px"></canvas>
        <hr class="my-2"/>
        <div class="fw-semibold mb-1 small">Alert Severity</div>
        <canvas id="severityChart" style="max-height:120px"></canvas>
      </div>
    </div>
  </div>

  <!-- Recent alerts -->
  <div class="row g-3">
    <div class="col-12">
      <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center bg-white border-0 pt-3 px-3">
          <span class="fw-semibold"><i class="fas fa-triangle-exclamation me-1 text-warning"></i>Recent Alerts</span>
          <a href="/alerts" class="btn btn-sm btn-outline-primary">View all →</a>
        </div>
        <div class="table-responsive">
          <table class="table table-sm mb-0">
            <thead class="table-light">
              <tr><th>Time</th><th>Source IP</th><th>Level</th><th>Score</th><th>Description</th><th></th></tr>
            </thead>
            <tbody id="alert-rows">
              <tr><td colspan="6" class="text-center py-3 text-muted">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

</div><!-- /container -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
const MAX = 60;
const traffic = new Chart(document.getElementById('trafficChart'), {
  type:'line', data:{labels:[],datasets:[{label:'pps',data:[],
    borderColor:'#2563eb',backgroundColor:'rgba(37,99,235,.1)',fill:true,tension:.3}]},
  options:{animation:false,responsive:true,maintainAspectRatio:false,
    scales:{y:{beginAtZero:true}},plugins:{legend:{display:false}}}
});
const proto = new Chart(document.getElementById('protoChart'), {
  type:'doughnut',
  data:{labels:['TCP','UDP','ICMP','Other'],
        datasets:[{data:[0,0,0,0],backgroundColor:['#2563eb','#0ea5e9','#f59e0b','#94a3b8']}]},
  options:{responsive:true,plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11}}}}}
});
const severity = new Chart(document.getElementById('severityChart'), {
  type:'bar',
  data:{labels:['High','Medium','Low'],
        datasets:[{data:[0,0,0],backgroundColor:['#dc2626','#d97706','#16a34a']}]},
  options:{responsive:true,plugins:{legend:{display:false}},
           scales:{y:{beginAtZero:true,ticks:{stepSize:1}}}}
});

const LVL = {High:'danger',Medium:'warning text-dark',Low:'success'};
const LBL = {High:'badge-High',Medium:'badge-Medium',Low:'badge-Low'};

async function refresh(){
  try{
    const [s,a,d,st] = await Promise.all([
      fetch('/api/stats/current').then(r=>r.json()),
      fetch('/api/alerts/recent').then(r=>r.json()),
      fetch('/api/traffic/distribution').then(r=>r.json()),
      fetch('/api/alerts/stats').then(r=>r.json()),
    ]);

    document.getElementById('pps').textContent          = Math.round(s.packets_per_second||0);
    document.getElementById('total-pkts').textContent   = (s.total_packets||0).toLocaleString();
    document.getElementById('active-alerts').textContent = s.active_alerts||0;
    document.getElementById('total-alerts').textContent  = s.total_alerts||0;

    const running = s.capture_running !== false;
    document.getElementById('sys-dot').textContent    = running ? '🟢' : '🔴';
    document.getElementById('sys-status').textContent = running ? 'Live' : 'Stopped';

    const now = new Date().toLocaleTimeString();
    if(traffic.data.labels.length>=MAX){traffic.data.labels.shift();traffic.data.datasets[0].data.shift();}
    traffic.data.labels.push(now);
    traffic.data.datasets[0].data.push(s.packets_per_second||0);
    traffic.update();

    proto.data.datasets[0].data=[d.tcp||0,d.udp||0,d.icmp||0,d.other||0]; proto.update();
    if(st.by_severity){
      severity.data.datasets[0].data=[st.by_severity.high||0,st.by_severity.medium||0,st.by_severity.low||0];
      severity.update();
    }

    const tbody = document.getElementById('alert-rows');
    if(!a.length){
      tbody.innerHTML='<tr><td colspan="6" class="text-center py-3 text-muted">No alerts yet</td></tr>';
    } else {
      tbody.innerHTML = a.map(x=>`
        <tr class="alert-row" onclick="location.href='/alert/${x.id}'">
          <td><small class="text-muted">${x.date}</small> ${x.time}</td>
          <td><code>${x.source_ip}</code></td>
          <td><span class="badge ${LBL[x.risk_level]||'bg-secondary'}">${x.risk_level}</span></td>
          <td>${(x.risk_score||0).toFixed(1)}</td>
          <td class="text-truncate" style="max-width:320px">${x.description}</td>
          <td><a href="/alert/${x.id}" class="btn btn-xs btn-outline-secondary btn-sm py-0">Trace</a></td>
        </tr>`).join('');
    }
  }catch(e){console.error(e);}
}
refresh(); setInterval(refresh,5000);
</script>
</body>
</html>
